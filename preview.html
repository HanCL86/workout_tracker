// ── Sheets API 호출 헬퍼 ──────────────────────────────────────
async function sheetsCall(action, params = {}) {
  const res = await fetch('/.netlify/functions/sheets', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...params }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '서버 오류 ' + res.status);
  return data;
}

function getDummyDate(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.toDateString();
}

function getDummyWeek(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return wKey(d);
}

  // 이번 주

const _sheetsCall = sheetsCall;
async function sheetsCall(action, params={}) {
  if (!PREVIEW_MODE) return _sheetsCall(action, params);
  await new Promise(r => setTimeout(r, 300)); // 로딩 시뮬레이션
  if (action === 'getAll') return { config: DUMMY_CFG, records: DUMMY_RECORDS };
  if (action === 'addCert') {
    DUMMY_RECORDS.push({
      name: params.name, week: params.week, date: params.date,
      duration: params.duration||0, exerciseType: params.exerciseType||null,
      timestamp: Date.now(),
    });
    return { ok: true };
  }
  if (action === 'saveConfig') { Object.assign(DUMMY_CFG, params); return { ok: true }; }
  return { ok: true };
}

async function analyzeImg(b64) {

    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image_base64: b64 }),
  });
  return res.json();
}

async function compressImg(file) {
  return new Promise(res => {
    const r = new FileReader(); r.onload = e => {
      const img = new Image(); img.onload = () => {
        const c = document.createElement('canvas'), M = 1024;
        let w = img.width, h = img.height;
        if (w > M) { h = Math.round(h*M/w); w = M; }
        c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.8).split(',')[1]);
      }; img.src = e.target.result;
    }; r.readAsDataURL(file);
  });
}

// ── 유틸 ─────────────────────────────────────────────────────
const won = n => n.toLocaleString() + '원';
function fDur(m) {
  if (!m) return '-';
  if (m < 60) return m + '분';
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h}시간 ${r}분` : `${h}시간`;
}
const today = () => new Date().toDateString();

// 두 가지 날짜 형식 파싱: "YYYY-MM-DD" 또는 "Mon May 19 2025"
function parseRecordDate(dateStr) {
  if (!dateStr) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  const d = new Date(dateStr);
  return isNaN(d.getTime()) ? null : d;
}
function isoW(d) {
  const u = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dy = u.getUTCDay()||7; u.setUTCDate(u.getUTCDate()+4-dy);
  const y0 = new Date(Date.UTC(u.getUTCFullYear(),0,1));
  return Math.ceil((((u-y0)/86400000)+1)/7);
}
function wKey(d=new Date()) { return `${d.getFullYear()}-W${String(isoW(d)).padStart(2,'0')}`; }
function wBounds(k) {
  const [y,w] = k.split('-W').map(Number);
  const j = new Date(y,0,4), m = new Date(j);
  m.setDate(j.getDate()-((j.getDay()||7)-1)+(w-1)*7);
  const s = new Date(m); s.setDate(m.getDate()+6);
  return {mon:m, sun:s};
}
const fd = d => `${d.getMonth()+1}/${d.getDate()}`;

function computeAllTimeFine(records, cfg) {
  const resetTs = cfg.resetTimestamp || 0;
  const thisWeek = wKey();
  // 현재 진행중인 주는 제외 (아직 인증 기회 남아있으므로)
  const filtered = records.filter(r => (r.timestamp||0) > resetTs && r.week !== thisWeek);
  const weeks = [...new Set(filtered.map(r=>r.week))];
  const names = [...new Set(filtered.map(r=>r.name))];
  let total = 0;
  for (const wk of weeks) {
    for (const name of names) {
      const rs = filtered.filter(r=>r.name===name&&r.week===wk);
      const cnt = new Set(rs.map(r=>r.date)).size;
      total += Math.min(Math.max(0,cfg.required-cnt)*cfg.finePerMiss, cfg.maxFine);
    }
  }
  return total;
}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
        <div><div style={S.lbl}>주당 필수 횟수</div><input ref={refs.r} type="number" defaultValue="2" min="1" max="7"/></div>
        <div><div style={S.lbl}>회당 벌금(원)</div><input ref={refs.f} type="number" defaultValue="5000" step="1000"/></div>
        <div><div style={S.lbl}>최대 벌금(원)</div><input ref={refs.m} type="number" defaultValue="10000" step="1000"/></div>

// ── 달력 뷰 ──────────────────────────────────────────────────
const MEMBER_COLORS = ['#4caf87','#7ab8e8','#e09a4c','#e05c5c','#b87de8','#78d4c8','#e878b4'];
const DOW_KR = ['월','화','수','목','금','토','일'];

function CalendarView({ records, cfg }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());

  const allNames = [...new Set(records.map(r=>r.name))];
  const colorMap = {};
  allNames.forEach((n,i) => colorMap[n] = MEMBER_COLORS[i % MEMBER_COLORS.length]);

  // 날짜별 인증자 목록
  const dateLookup = {};
  for (const r of records) {
    const d = parseRecordDate(r.date);
    if (!d || d.getFullYear()!==year || d.getMonth()!==month) continue;
    const key = d.getDate();
    if (!dateLookup[key]) dateLookup[key] = new Set();
    dateLookup[key].add(r.name);
  }

  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // 월=0
  const lastDate = new Date(year, month+1, 0).getDate();
  const todayDate = now.getFullYear()===year && now.getMonth()===month ? now.getDate() : -1;

  const cells = [];
  for (let i=0; i<firstDow; i++) cells.push(null);
  for (let d=1; d<=lastDate; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const prevMonth = () => { if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = () => { if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  return <div>
    {/* 월 네비게이션 */}
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <button style={{...S.sm,fontSize:16,padding:'4px 12px'}} onClick={prevMonth}>‹</button>
      <span style={{fontSize:15,fontWeight:500,color:'#fff'}}>{year}년 {month+1}월</span>
      <button style={{...S.sm,fontSize:16,padding:'4px 12px'}} onClick={nextMonth}>›</button>
    </div>

    {/* 요일 헤더 */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:3}}>
      {DOW_KR.map(d=><div key={d} style={{textAlign:'center',fontSize:11,color:'#555',padding:'4px 0'}}>{d}</div>)}
    </div>

    {/* 날짜 셀 */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
      {cells.map((day,i)=>{
        if(!day) return <div key={i}/>;
        const certs = dateLookup[day] ? [...dateLookup[day]] : [];
        const isToday = day===todayDate;
        const allDone = allNames.length>0 && allNames.every(n=>dateLookup[day]?.has(n));
        return <div key={i} style={{
          background: allDone?'#0d2a1a':certs.length>0?'#161e16':'#141414',
          border:`1px solid ${isToday?'#4caf87':allDone?'#1a5c2a':'#222'}`,
          borderRadius:8,
          padding:'4px 2px 6px',
          minHeight:52,
        }}>
          <div style={{fontSize:11,textAlign:'center',color:isToday?'#4caf87':'#555',marginBottom:3}}>{day}</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:2,justifyContent:'center'}}>
            {certs.map(n=><div key={n} style={{width:8,height:8,borderRadius:'50%',background:colorMap[n]||'#888'}} title={n}/>)}
          </div>
        </div>;
      })}
    </div>

    {/* 범례 */}
    {allNames.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:10,marginTop:14,padding:'10px 0'}}>
      {allNames.map(n=><div key={n} style={{display:'flex',alignItems:'center',gap:5}}>
        <div style={{width:9,height:9,borderRadius:'50%',background:colorMap[n]}}/>
        <span style={{fontSize:12,color:'#888'}}>{n}</span>
      </div>)}
    </div>}
  </div>;
}

// ── 메인 화면 ─────────────────────────────────────────────────
function MainScreen({cfg,records,me,onCert,onLogout,onAdmin,onRefresh,refreshing}) {
  const [view, setView] = useState('status'); // 'status' | 'calendar'
  const w = wKey(); const {mon,sun} = wBounds(w);
  const myR = records.filter(r=>r.name===me&&r.week===w);
  const cnt = new Set(myR.map(r=>r.date)).size;
  const done = cnt>=cfg.required;
  const fine = Math.min(Math.max(0,cfg.required-cnt)*cfg.finePerMiss, cfg.maxFine);

  const allTimeFine = computeAllTimeFine(records, cfg);
  const beers = Math.floor(allTimeFine / cfg.finePerMiss);
  const names = [...new Set(records.map(r=>r.name))];

  if (!names.includes(me)) names.push(me);
  let tf = 0;
  const rows = names.map(n=>{
    const rs = records.filter(r=>r.name===n&&r.week===w);
    const c = new Set(rs.map(r=>r.date)).size;
    const dur = rs.reduce((s,r)=>s+(r.duration||0),0);
    const f = Math.min(Math.max(0,cfg.required-c)*cfg.finePerMiss, cfg.maxFine);
    tf+=f; return{name:n,cnt:c,fine:f,dur};
  }).sort((a,b)=>b.cnt-a.cnt||a.fine-b.fine);

  const SmDot = ({on}) => <div style={{width:10,height:10,borderRadius:'50%',background:on?'#2a6a3a':'#222',border:`1px solid ${on?'#3a8a4a':'#333'}`}}/>;
  const BigDot = ({on}) => <div style={{width:36,height:36,borderRadius:'50%',border:`1px solid ${on?'#2a6a3a':'#333'}`,display:'flex',alignItems:'center',justifyContent:'center',background:on?'#1a4a2a':'#111'}}>
    {on&&<i className="ti ti-check" style={{fontSize:16,color:'#4caf87'}}/>}
  </div>;

  return <div style={S.wrap}>
    <div style={S.tb}>
      <span style={{fontSize:14,fontWeight:500,color:'#fff'}}>{me} 님</span>
      <div style={{display:'flex',gap:6}}>
        <button style={{...S.sm,opacity:refreshing?.5:1}} onClick={onRefresh} disabled={refreshing}>
          <i className={`ti ti-${refreshing?'loader':'refresh'}`}/>
        </button>

// ── 인증 화면 ─────────────────────────────────────────────────
function CertScreen({onCancel,onConfirm}) {
  const [st,setSt] = useState('upload'); // upload|loading|result|saving
  const [preview,setPreview] = useState(null);
  const [result,setResult] = useState(null);
  const fileRef = useRef();

  const handleFile = async e => {
    const file = e.target.files[0]; if(!file) return;
    const r2=new FileReader(); r2.onload=ev=>setPreview(ev.target.result); r2.readAsDataURL(file);
    setSt('loading');
    try {
      const b64 = await compressImg(file);
      const res = await analyzeImg(b64);
      setResult(res); setSt('result');
    } catch(err) {
      setResult({verified:false,reason:'분석 오류: '+err.message}); setSt('result');
    }
  };

  const confirm = async () => {
    setSt('saving');
    await onConfirm(result.duration_minutes||0, result.exercise_type||null, result.exercise_date||null);
  };
  const retry = () => { setSt('upload'); setPreview(null); if(fileRef.current) fileRef.current.value=''; };

  return <div style={S.wrap}>
    <div style={S.tb}>
      <button style={S.sm} onClick={onCancel}><i className="ti ti-arrow-left"/> 취소</button>
      <span style={{fontSize:14,fontWeight:500,color:'#fff'}}>운동 인증</span>
      <div style={{width:50}}/>
    </div>

    {preview && <div style={{marginBottom:12}}><img src={preview} style={{width:'100%',borderRadius:12,maxHeight:240,objectFit:'cover'}}/></div>}

    {st==='upload'&&<div onClick={()=>fileRef.current.click()}
      style={{textAlign:'center',padding:'2.5rem 1rem',cursor:'pointer',border:'1.5px dashed #2a2a2a',borderRadius:14,marginBottom:12}}>
      <i className="ti ti-upload" style={{fontSize:36,color:'#444'}}/>
      <div style={{fontSize:15,fontWeight:500,margin:'10px 0 4px',color:'#ccc'}}>운동 앱 스크린샷 업로드</div>
      <div style={{fontSize:12,color:'#555'}}>삼성헬스 · 애플피트니스 · 나이키런 · 스트라바 · 가민</div>
    </div>}

    {(st==='loading'||st==='saving')&&<div style={{...S.card,textAlign:'center',padding:'2rem'}}>
      <i className="ti ti-loader" style={{fontSize:28,color:'#666'}}/>
      <div style={{fontSize:13,color:'#777',marginTop:10}}>
        {st==='loading'?'Haiku AI가 운동 기록을 분석 중이에요...':'인증을 저장하는 중이에요...'}
      </div>
    </div>}

    {st==='result'&&result&&(result.verified ? <>
      <div style={{background:'#0d2a1a',border:'1px solid #1a5c2a',borderRadius:12,padding:'12px 14px',marginBottom:10}}>
        <div style={{fontSize:14,fontWeight:500,color:'#4caf87',marginBottom:6}}><i className="ti ti-circle-check"/> 운동 인증 확인됨</div>
        {result.exercise_type&&<div style={{fontSize:13,color:'#4caf87'}}>종류: {result.exercise_type}</div>}
          {result.exercise_date&&<div style={{fontSize:13,color:'#4caf87'}}>운동 날짜: {result.exercise_date}</div>}
        {result.duration_minutes&&<div style={{fontSize:13,color:'#4caf87'}}>운동 시간: {fDur(result.duration_minutes)}</div>}
        <div style={{fontSize:12,color:'#4caf87',marginTop:4,opacity:.8}}>{result.reason}</div>
      </div>
      <button style={S.bb('#1a5c2a')} onClick={confirm}>인증 완료하기</button>
    </> : <>
      <div style={{background:'#2a1010',border:'1px solid #5c1a1a',borderRadius:12,padding:'12px 14px',marginBottom:10}}>
        <div style={{fontSize:14,fontWeight:500,color:'#e05c5c',marginBottom:6}}><i className="ti ti-x"/> 운동 기록을 확인할 수 없어요</div>
        <div style={{fontSize:13,color:'#e05c5c'}}>{result.reason||'운동 앱 스크린샷이 아닌 것 같아요'}</div>
      </div>
      <button style={S.bb()} onClick={retry}>다시 시도</button>
      <p style={{fontSize:12,color:'#444',textAlign:'center',marginTop:8}}>삼성헬스, 스트라바, 나이키런 등 운동 완료 화면을 캡처해 주세요</p>
    </>)}

    <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
  </div>;
}

// ── 벌금 초기화 모달 ─────────────────────────────────────────
function ResetModal({cfg, onClose, onReset}) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const doReset = async () => {
    if (!cfg.adminPassword) { setErr('관리자 비밀번호가 설정되지 않았어요. 구글 시트 config탭 E2에 비밀번호를 입력하세요.'); return; }
    if (pw !== cfg.adminPassword) { setErr('비밀번호가 맞지 않아요'); return; }
    setBusy(true);
    try {
      const nc = {...cfg, resetTimestamp: Date.now()};
      await sheetsCall('saveConfig', nc);
      onReset(nc);
      alert('벌금이 초기화됐어요! 🍺 술 한잔 하세요!');
      onClose();
    } catch(e) { setErr('오류: '+e.message); }
    finally { setBusy(false); }
  };
  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:999,padding:'1rem'}}>
    <div style={{background:'#1a1a1a',border:'1px solid #333',borderRadius:16,padding:'1.5rem',width:'100%',maxWidth:360}}>
      <div style={{fontSize:16,fontWeight:500,color:'#fff',marginBottom:8}}>🍺 벌금 초기화</div>
      <div style={{fontSize:13,color:'#888',marginBottom:16}}>
        현재까지 누적된 벌금 기록을 초기화합니다.<br/>
        기존 기록은 삭제되지 않아요.
      </div>
      <div style={S.lbl}>관리자 비밀번호</div>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="비밀번호 입력" style={{marginBottom:8}}/>
      <div style={S.err}>{err}</div>
      <div style={{display:'flex',gap:8,marginTop:8}}>
        <button style={{flex:1,padding:'11px',fontSize:14,background:'#222',border:'1px solid #333',color:'#888',borderRadius:8,cursor:'pointer'}} onClick={onClose}>취소</button>
        <button style={{...S.bb('#8b1a1a'),flex:1,marginTop:0,opacity:busy?.5:1}} onClick={doReset} disabled={busy}>
          {busy?'처리 중...':'초기화하기'}
        </button>
      </div>
    </div>
  </div>;
}

// ── 관리자 화면 ───────────────────────────────────────────────
function AdminScreen({cfg, records, me, onBack, onCfgSaved, onNameChange}) {
  const [newCode, setNewCode] = useState('');
  const [req,  setReq]  = useState(String(cfg.required));
  const [fine, setFine] = useState(String(cfg.finePerMiss));
  const [max,  setMax]  = useState(String(cfg.maxFine));
  const [err,  setErr]  = useState('');
  const [busy, setBusy] = useState(false);
  const [showReset, setShowReset] = useState(false);
  const [localCfg, setLocalCfg] = useState(cfg);

  // 이름 변경
  const [newName, setNewName] = useState('');
  const [nameErr, setNameErr] = useState('');

  const weeks = [...new Set(records.map(r=>r.week))].sort().reverse();
  const names = [...new Set(records.map(r=>r.name))];
  const cT={},cF={};names.forEach(n=>{cT[n]=0;cF[n]=0;});

  const changeName = () => {
    const n = newName.trim();
    if (!n) { setNameErr('이름을 입력하세요'); return; }
    if (n === me) { setNameErr('현재 이름과 같아요'); return; }
    onNameChange(n);
    setNewName('');
    setNameErr('');
    alert(`이름이 "${n}"으로 변경됐어요!`);
  };

  const changeCode = async () => {
    const code = newCode.trim().toUpperCase();
    if (!code) { setErr('새 코드를 입력하세요'); return; }
    // 코드가 이름처럼 생겼으면 경고
    if (code.length <= 4 && /^[가-힣]+$/.test(code)) {
      if (!window.confirm(`"${code}"를 초대 코드로 설정할까요?
(이름이 아닌 그룹 코드로 사용돼요)`)) return;
    }
    setBusy(true);
    try {
      const nc = {...localCfg, inviteCode: code};
      await sheetsCall('saveConfig', nc);
      setLocalCfg(nc); onCfgSaved(nc);
      alert(`초대 코드가 "${code}"로 변경됐어요!
기존 멤버들에게 새 코드를 알려주세요.`);
      setNewCode(''); setErr('');
    } catch(e) { setErr('오류: '+e.message); }
    finally { setBusy(false); }
  };

  const saveRules = async () => {
    setBusy(true);
    try {
      const nc = {...localCfg, required:+req||2, finePerMiss:+fine||5000, maxFine:+max||10000};
      await sheetsCall('saveConfig', nc);
      setLocalCfg(nc); onCfgSaved(nc);
      alert('저장됐어요!');
    } catch(e) { alert('오류: '+e.message); }
    finally { setBusy(false); }
  };

  return <div style={S.wrap}>
    {showReset && <ResetModal cfg={localCfg} onClose={()=>setShowReset(false)} onReset={nc=>{setLocalCfg(nc);onCfgSaved(nc);}}/>}
    <div style={S.tb}>
      <button style={S.sm} onClick={onBack}><i className="ti ti-arrow-left"/> 돌아가기</button>
      <span style={{fontSize:14,fontWeight:500,color:'#fff'}}>그룹 설정</span>
      <div style={{width:60}}/>
    </div>

    {/* 내 이름 변경 */}
    <div style={S.card}>
      <div style={S.sec}>내 이름 변경</div>
      <div style={{fontSize:13,color:'#666',marginBottom:4}}>현재 이름: <strong style={{color:'#ccc'}}>{me}</strong></div>
      <div style={{fontSize:11,color:'#555',background:'#111',padding:'6px 10px',borderRadius:6,marginBottom:8}}>
        ℹ️ 이름 변경 후 기존 인증 기록은 이전 이름으로 남아요. 기록 통일이 필요하면 구글 시트에서 직접 수정하세요.
      </div>
      <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="새 이름 입력" style={{fontSize:14}}/>
      <div style={S.err}>{nameErr}</div>
      <button style={{...S.bb(),marginTop:8}} onClick={changeName}>이름 변경</button>
    </div>

    {/* 초대 코드 변경 */}
    <div style={S.card}>
      <div style={S.sec}>초대 코드 변경</div>
      <div style={{fontSize:13,color:'#666',marginBottom:4}}>현재: <strong style={{color:'#aaa',letterSpacing:3}}>{localCfg.inviteCode}</strong></div>
      <div style={{fontSize:11,color:'#664',background:'#1a1800',padding:'6px 10px',borderRadius:6,marginBottom:8}}>
        ⚠️ 이름 변경은 위 "내 이름 변경"을 사용하세요. 여기는 그룹 입장 코드만 변경하는 곳이에요.
      </div>
      <input value={newCode} onChange={e=>setNewCode(e.target.value.toUpperCase())} placeholder="새 초대 코드 (예: GYM2025)" style={{letterSpacing:3,fontSize:15}}/>
      <div style={{fontSize:11,color:'#555',marginTop:4}}>코드 변경 시 모든 멤버가 재로그인 필요해요</div>
      <button style={{...S.bb(),opacity:busy?.5:1,marginTop:8}} onClick={changeCode} disabled={busy}>코드 변경</button>
      <div style={S.err}>{err}</div>
    </div>

    {/* 규칙 변경 */}
    <div style={S.card}>
      <div style={S.sec}>규칙 변경</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:8}}>
        <div><div style={S.lbl}>필수 횟수</div><input type="number" value={req} onChange={e=>setReq(e.target.value)} min="1" max="7"/></div>
        <div><div style={S.lbl}>회당 벌금</div><input type="number" value={fine} onChange={e=>setFine(e.target.value)} step="1000"/></div>
        <div><div style={S.lbl}>최대 벌금</div><input type="number" value={max} onChange={e=>setMax(e.target.value)} step="1000"/></div>
      </div>
      <button style={{...S.bb(),opacity:busy?.5:1}} onClick={saveRules} disabled={busy}>저장</button>
    </div>

    {/* 벌금 초기화 */}
    <div style={{...S.card,border:'1px solid #3a1a1a'}}>
      <div style={S.sec}>🍺 벌금 초기화</div>
      <div style={{fontSize:13,color:'#888',marginBottom:10}}>누적된 벌금을 0으로 리셋해요. 관리자 비밀번호가 필요해요.</div>
      <button style={{...S.bb('#8b1a1a'),marginTop:0}} onClick={()=>setShowReset(true)}>초기화하기</button>
    </div>

  <div style={S.card}>
      <div style={S.sec}>누적 기록 · 정산</div>
      {!weeks.length
        ? <div style={{fontSize:13,color:'#444',textAlign:'center',padding:'1rem'}}>아직 기록이 없어요</div>
        : <>
          <div style={{display:'flex',justifyContent:'flex-end',fontSize:11,color:'#444',paddingBottom:6}}>
            <span style={{minWidth:70,textAlign:'center'}}>운동시간</span>
            <span style={{minWidth:60,textAlign:'right'}}>벌금</span>
          </div>
          {weeks.map(k=>{
            const{mon,sun}=wBounds(k);
            return <div key={k} style={{marginBottom:14}}>
              <div style={{fontSize:11,color:'#444',marginBottom:4,paddingBottom:4,borderBottom:'1px solid #1e1e1e'}}>{fd(mon)} ~ {fd(sun)}</div>
              {names.map(n=>{
                const rs=records.filter(r=>r.name===n&&r.week===k);
                const c=new Set(rs.map(r=>r.date)).size;
                const dur=rs.reduce((s,r)=>s+(r.duration||0),0);
                const f=Math.min(Math.max(0,cfg.required-c)*cfg.finePerMiss,cfg.maxFine);
                cT[n]+=dur;cF[n]+=f;
                const ok=c>=cfg.required;
                return <div key={n} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid #1a1a1a',fontSize:13}}>
                  <span style={{color:'#ccc'}}>{n}</span>
                  <span style={{color:'#666',minWidth:70,textAlign:'center'}}>{fDur(dur)}</span>
                  <span style={{fontWeight:500,minWidth:60,textAlign:'right',color:ok?'#4caf87':f>0?'#e05c5c':'#666'}}>{ok?'완료':f>0?`-${won(f)}`:`${c}/${cfg.required}`}</span>
                </div>;
              })}
            </div>;
          })}
          <div style={{borderTop:'1px solid #222',paddingTop:10,marginTop:4}}>
            <div style={{fontSize:11,color:'#444',marginBottom:6}}>누적 합계</div>
            {names.map(n=><div key={n} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid #1a1a1a',fontSize:13}}>
              <span style={{fontWeight:500,color:'#ccc'}}>{n}</span>
              <span style={{color:'#666',minWidth:70,textAlign:'center'}}>{fDur(cT[n])}</span>
              <span style={{fontWeight:500,minWidth:60,textAlign:'right',color:cF[n]>0?'#e05c5c':'#4caf87'}}>{cF[n]>0?`-${won(cF[n])}`:'0원'}</span>
            </div>)}
          </div>
        </>
      }
    </div>
  </div>;
}

// ── 앱 루트 ──────────────────────────────────────────────────
function App() {
  const [screen,  setScreen]  = useState('loading');
  const [cfg,     setCfg]     = useState(null);
  const [records, setRecords] = useState([]);
  const [me,      setMe]      = useState('');
  const [refreshing, setRefreshing] = useState(false);

  // 앱 로드 시 Sheets에서 데이터 가져오기
  useEffect(() => {
    let auth = LS.get(AK);
    if (PREVIEW_MODE && !auth?.verified) {
      auth = { name: '나 (미리보기)', verified: true };
      LS.set(AK, auth);
    }
    if (auth?.verified) setMe(auth.name);
    sheetsCall('getAll')
      .then(({config,records}) => {
        setRecords(records || []);
        if (!config) {
          setScreen('setup');
        } else {
          setCfg(config);
          setScreen(auth?.verified ? 'main' : 'code');
        }
      })
      .catch(e => {
        console.error(e);
        setScreen('error');
      });
  }, []);

  const refresh = async () => {
    setRefreshing(true);
    try {
      const {config,records} = await sheetsCall('getAll');
      if (config) setCfg(config);
      setRecords(records || []);
    } catch(e) { alert('새로고침 실패: '+e.message); }
    finally { setRefreshing(false); }
  };

  const login = (name) => { setMe(name); LS.set(AK,{name,verified:true}); };
  const logout = () => { setMe(''); LS.set(AK,{name:'',verified:false}); setScreen('code'); };

  if (screen==='loading') return <div style={S.wrap}><Logo icon="🏃" title="뚱망 방지 위원회"/><Spinner msg="Google Sheets에서 불러오는 중..."/></div>;
  if (screen==='error')   return <div style={S.wrap}>
    <Logo icon="⚠️" title="연결 오류" sub="Google Sheets 연결에 실패했어요"/>
    <div style={{...S.card,textAlign:'center',padding:'1.5rem'}}>
      <div style={{fontSize:13,color:'#888',marginBottom:16}}>
        Netlify 환경변수(GOOGLE_SERVICE_ACCOUNT, SPREADSHEET_ID)를 확인하세요
      </div>
      <button style={S.bb()} onClick={()=>{ setScreen('loading'); sheetsCall('getAll').then(({config,records})=>{ setRecords(records||[]); if(!config){setScreen('setup');}else{setCfg(config);const auth=LS.get(AK);setScreen(auth?.verified?'main':'code');} }).catch(()=>setScreen('error')); }}>
        다시 시도
      </button>
    </div>
  </div>;
  if (screen==='setup')   return <SetupScreen onDone={(cfg,name)=>{ setCfg(cfg); login(name); setScreen('main'); }}/>;
  if (screen==='code')    return <CodeScreen cfg={cfg} onOk={()=>setScreen('name')}/>;
  if (screen==='name')    return <NameScreen onDone={name=>{ login(name); setScreen('main'); }}/>;
  if (screen==='cert')    return <CertScreen
    onCancel={()=>setScreen('main')}
    onConfirm={async (dur,exType,exDate)=>{
      const certDate = exDate || today();
      const certWeek = exDate ? wKey(new Date(exDate)) : wKey();
      await sheetsCall('addCert',{name:me,week:certWeek,date:certDate,exerciseType:exType,duration:dur});
      await refresh();
      setScreen('main');
    }}
  />;
  if (screen==='admin')   return <AdminScreen cfg={cfg} records={records} me={me} onBack={()=>setScreen('main')} onCfgSaved={c=>{setCfg(c);}} onNameChange={name=>{login(name);}} />;

  return <MainScreen cfg={cfg} records={records} me={me}
    onCert={()=>setScreen('cert')}
    onLogout={logout}
    onAdmin={()=>setScreen('admin')}
    onRefresh={refresh}
    refreshing={refreshing}
  />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
