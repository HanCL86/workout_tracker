async function sheetsCall(action, params = {}) {
  const res = await fetch('/.netlify/functions/sheets', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...params }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '서버 오류 ' + res.status);
  return data;
}

async function analyzeImg(b64) {
  const d = new Date();
  const clientDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const res = await fetch('/.netlify/functions/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image_base64: b64, client_date: clientDate }),
  });
  return res.json();
}

async function compressImg(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1024;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const won = n => n.toLocaleString() + '원';

function fDur(m) {
  if (!m) return '-';
  if (m < 60) return m + '분';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + '시간 ' + r + '분' : h + '시간';
}

const today = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};

function parseDate(s) {
  if (!s) return null;
  // YYYY-MM-DD 형식
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  // "Mon Jun 01 2026" 형식 (구버전 호환)
  const monthMap = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const m = s.match(/\w+\s+(\w+)\s+(\d+)\s+(\d{4})/);
  if (m && monthMap[m[1]] !== undefined) {
    return new Date(parseInt(m[3]), monthMap[m[1]], parseInt(m[2]));
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function isoW(d) {
  const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dy = u.getUTCDay() || 7;
  u.setUTCDate(u.getUTCDate() + 4 - dy);
  const y0 = new Date(Date.UTC(u.getUTCFullYear(), 0, 1));
  return Math.ceil((((u - y0) / 86400000) + 1) / 7);
}

function wKey(d) {
  const date = d || new Date();
  return date.getFullYear() + '-W' + String(isoW(date)).padStart(2, '0');
}

function wBounds(k) {
  const parts = k.split('-W').map(Number);
  const y = parts[0], w = parts[1];
  const j = new Date(y, 0, 4);
  const m = new Date(j);
  m.setDate(j.getDate() - ((j.getDay() || 7) - 1) + (w - 1) * 7);
  const s = new Date(m);
  s.setDate(m.getDate() + 6);
  return { mon: m, sun: s };
}

const fd = d => (d.getMonth() + 1) + '/' + d.getDate();

function allTimeFine(records, cfg) {
  const resetTs = cfg.resetTimestamp || 0;
  const thisWk = wKey();

  // 리셋 이후, 현재 주 제외
  const filtered = records.filter(r => (r.timestamp || 0) > resetTs && r.week !== thisWk);

  // 주차별로 그 주에 최소 1회 기록 있는 사람만 집계
  // (기록이 아예 없는 사람은 그 주에 참여 안 한 것으로 판단)
  const weeks = [...new Set(filtered.map(r => r.week))];
  let total = 0;
  for (const wk of weeks) {
    // 이 주에 기록이 있는 사람 목록
    const weekRecords = filtered.filter(r => r.week === wk);
    const activeNames = [...new Set(weekRecords.map(r => r.name))];
    for (const name of activeNames) {
      const cnt = new Set(weekRecords.filter(r => r.name === name && (r.duration || 0) >= 30).map(r => r.date)).size;
      total += Math.min(Math.max(0, cfg.required - cnt) * cfg.finePerMiss, cfg.maxFine);
    }
  }
  return total;
}

function SetupScreen(props) {
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const cRef = useRef(), rRef = useRef(), fRef = useRef(), mRef = useRef(), nRef = useRef(), pRef = useRef();

  const submit = async () => {
    const code = cRef.current.value.trim().toUpperCase();
    const name = nRef.current.value.trim();
    if (!code) { setErr('초대 코드를 입력하세요'); return; }
    if (!name) { setErr('이름을 입력하세요'); return; }
    const cfg = {
      inviteCode: code,
      required: parseInt(rRef.current.value) || 2,
      finePerMiss: parseInt(fRef.current.value) || 5000,
      maxFine: parseInt(mRef.current.value) || 10000,
      adminPassword: pRef.current.value.trim(),
      resetTimestamp: 0,
    };
    setBusy(true);
    try {
      await sheetsCall('saveConfig', cfg);
      props.onDone(cfg, name);
    } catch(e) {
      setErr('저장 실패: ' + e.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={S.wrap}>

        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 14 }}>
          <div><div style={S.lbl}>주당 필수 횟수</div><input ref={rRef} type="number" defaultValue="2" min="1" max="7" /></div>
          <div><div style={S.lbl}>회당 벌금(원)</div><input ref={fRef} type="number" defaultValue="5000" step="1000" /></div>
          <div><div style={S.lbl}>최대 벌금(원)</div><input ref={mRef} type="number" defaultValue="10000" step="1000" /></div>
        </div>
        <div style={S.fld}>
          <div style={S.lbl}>내 이름</div>
          <input ref={nRef} placeholder="홍길동" />
        </div>
        <div style={S.fld}>
          <div style={S.lbl}>관리자 비밀번호 (벌금 초기화 시 필요)</div>

        </div>

        <button style={Object.assign({}, S.bb(), { opacity: busy ? 0.6 : 1 })} onClick={submit} disabled={busy}>

      </div>
    </div>
  );
}

const MEMBER_ICONS = [
  { shape: '👻', color: '#4caf87' },
  { shape: '🐸', color: '#e05c5c' },
  { shape: '🐼', color: '#7ab8e8' },

];
const SHAPE_OPTS = ['👻','🐸','🐼','🦊','🐯','🐻','🐧','🦁','🐮','🐷','🦋','🐙','🦄','🐺','🐸','🐲','🦖','🌟','🔥','⚡','🎯','💎','🎸','🍕','🎃','🚀','💪','🏆','🌈','❤️'];
const COLOR_OPTS = ['#4caf87','#e05c5c','#7ab8e8','#e09a4c','#b87de8','#78d4c8','#e878b4','#f0c040','#ff6b35','#aaaaaa','#ffffff','#ff4dd2'];
const DAYS_KR = ['월','화','수','목','금','토','일'];

function CalendarView(props) {
  const records = props.records;
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());

  const names = [...new Set(records.map(r => r.name))];
  const iconMap = {};
  names.forEach((n, i) => {
    const custom = props.cfg && props.cfg.iconConfig && props.cfg.iconConfig[n];
    iconMap[n] = custom || MEMBER_ICONS[i % MEMBER_ICONS.length];
  });

  const lookup = {};
  records.forEach(r => {
    const d = parseDate(r.date);
    if (!d || d.getFullYear() !== year || d.getMonth() !== month) return;
    const key = d.getDate();
    if (!lookup[key]) lookup[key] = new Set();
    lookup[key].add(r.name);
  });

  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
  const lastDate = new Date(year, month + 1, 0).getDate();
  const todayDate = (now.getFullYear() === year && now.getMonth() === month) ? now.getDate() : -1;

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= lastDate; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const prevMonth = () => {
    if (month === 0) { setMonth(11); setYear(y => y - 1); }
    else setMonth(m => m - 1);
  };
  const nextMonth = () => {
    if (month === 11) { setMonth(0); setYear(y => y + 1); }
    else setMonth(m => m + 1);
  };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <button style={Object.assign({}, S.sm, { fontSize: 16, padding: '4px 12px' })} onClick={prevMonth}>&#8249;</button>
        <span style={{ fontSize: 15, fontWeight: 500, color: '#fff' }}>{year}년 {month + 1}월</span>
        <button style={Object.assign({}, S.sm, { fontSize: 16, padding: '4px 12px' })} onClick={nextMonth}>&#8250;</button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 3, marginBottom: 3 }}>
        {DAYS_KR.map(d => (
          <div key={d} style={{ textAlign: 'center', fontSize: 11, color: '#555', padding: '4px 0' }}>{d}</div>
        ))}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 3 }}>
        {cells.map((day, i) => {
          if (!day) return <div key={i} />;
          const certs = lookup[day] ? [...lookup[day]] : [];
          const isToday = day === todayDate;
          const allDone = names.length > 0 && names.every(n => lookup[day] && lookup[day].has(n));
          const bg = allDone ? '#0d2a1a' : certs.length > 0 ? '#161e16' : '#141414';
          const border = isToday ? '#4caf87' : allDone ? '#1a5c2a' : '#222';
          return (
            <div key={i} style={{ background: bg, border: '1px solid ' + border, borderRadius: 8, padding: '4px 2px 6px', minHeight: 52 }}>
              <div style={{ fontSize: 11, textAlign: 'center', color: isToday ? '#4caf87' : '#555', marginBottom: 3 }}>{day}</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 2, justifyContent: 'center' }}>
                {certs.map(n => (
                  <span key={n} title={n} style={{ fontSize: 12, lineHeight: 1 }}>
                    {(iconMap[n] || MEMBER_ICONS[i % MEMBER_ICONS.length]).shape}
                  </span>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      {names.length > 0 && (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginTop: 14 }}>
          {names.map(n => (
            <div key={n} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
              <span style={{ fontSize: 16, lineHeight: 1 }}>
                {(iconMap[n] || MEMBER_ICONS[names.indexOf(n) % MEMBER_ICONS.length]).shape}
              </span>
              <span style={{ fontSize: 12, color: '#888' }}>{n}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MainScreen(props) {
  const { cfg, records, me, onCert, onLogout, onAdmin, onRefresh, refreshing } = props;
  const [view, setView] = useState('status');

  const wk = wKey();
  const bounds = wBounds(wk);
  const myR = records.filter(r => r.name === me && r.week === wk);
  const cnt = new Set(myR.filter(r => (r.duration || 0) >= 30).map(r => r.date)).size;
  const done = cnt >= cfg.required;
  const fine = Math.min(Math.max(0, cfg.required - cnt) * cfg.finePerMiss, cfg.maxFine);

  const total = allTimeFine(records, cfg);
  const beers = Math.floor(total / cfg.finePerMiss);

  const names = [...new Set(records.map(r => r.name))];
  if (!names.includes(me)) names.push(me);
  let tf = 0;
  const rows = names.map(n => {
    const rs = records.filter(r => r.name === n && r.week === wk);
    const c = new Set(rs.map(r => r.date)).size;
    const dur = rs.reduce((s, r) => s + (r.duration || 0), 0);
    const f = Math.min(Math.max(0, cfg.required - c) * cfg.finePerMiss, cfg.maxFine);
    tf += f;
    return { name: n, cnt: c, fine: f, dur };
  }).sort((a, b) => b.cnt - a.cnt || a.fine - b.fine);

  const tabStyle = active => ({
    flex: 1, padding: '8px', fontSize: 13, fontWeight: active ? 600 : 400,
    background: active ? '#1e3a5f' : 'transparent',
    color: active ? '#7ab8e8' : '#555',
    border: '1px solid ' + (active ? '#1e5f8e' : '#222'),
    borderRadius: 8, cursor: 'pointer',
  });

  const BigDot = ({ on }) => (
    <div style={{ width: 36, height: 36, borderRadius: '50%', border: '1px solid ' + (on ? '#2a6a3a' : '#333'), display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? '#1a4a2a' : '#111' }}>
      {on && <i className="ti ti-check" style={{ fontSize: 16, color: '#4caf87' }} />}
    </div>
  );

  const SmDot = ({ on }) => (
    <div style={{ width: 10, height: 10, borderRadius: '50%', background: on ? '#2a6a3a' : '#222', border: '1px solid ' + (on ? '#3a8a4a' : '#333') }} />
  );

  return (
    <div style={S.wrap}>
      <div style={S.tb}>
        <span style={{ fontSize: 14, fontWeight: 500, color: '#fff' }}>{me} 님</span>
        <div style={{ display: 'flex', gap: 6 }}>
          <button style={Object.assign({}, S.sm, { opacity: refreshing ? 0.5 : 1 })} onClick={onRefresh} disabled={refreshing}>
            <i className={'ti ti-' + (refreshing ? 'loader' : 'refresh')} />
          </button>
          <button style={S.sm} onClick={onAdmin}><i className="ti ti-settings" /></button>
          <button style={S.sm} onClick={onLogout}><i className="ti ti-logout" /></button>
        </div>
      </div>

function CertScreen(props) {
  const [st, setSt] = useState('upload'); // upload | analyzing | result
  const [items, setItems] = useState([]); // [{file, preview, status, result}]
  const fileRef = useRef();

  const handleFiles = async e => {
    const files = [...e.target.files];
    if (!files.length) return;

    // 미리보기 먼저 생성
    const initial = await Promise.all(files.map(async file => {
      const preview = await new Promise(res => {
        const r = new FileReader();
        r.onload = ev => res(ev.target.result);
        r.readAsDataURL(file);
      });
      return { file, preview, status: 'pending', result: null };
    }));
    setItems(initial);
    setSt('analyzing');

    // 모든 이미지 동시에 AI 분석
    const analyzed = await Promise.all(initial.map(async (item, idx) => {
      try {
        const b64 = await compressImg(item.file);
        const result = await analyzeImg(b64);
        return { ...item, status: result.verified ? 'ok' : 'fail', result };
      } catch(err) {
        return { ...item, status: 'fail', result: { verified: false, reason: '분석 오류: ' + err.message } };
      }
    }));
    setItems(analyzed);
    setSt('result');
  };

  const confirmAll = async () => {
    setSt('analyzing');
    const verified = items.filter(it => it.status === 'ok');
    for (const it of verified) {
      const exDate = it.result.exercise_date || null;
      const certDate = exDate || today();
      const certWeek = exDate ? wKey(new Date(exDate)) : wKey();
      await props.onConfirmOne(certDate, certWeek, it.result.duration_minutes || 0, it.result.exercise_type || null);
    }
    props.onDone();
  };

  const toggleItem = idx => {
    setItems(prev => prev.map((it, i) =>
      i === idx ? { ...it, status: it.status === 'ok' ? 'skip' : it.status === 'skip' ? 'ok' : it.status } : it
    ));
  };

  const okCount = items.filter(it => it.status === 'ok').length;

  return (
    <div style={S.wrap}>
      <div style={S.tb}>
        <button style={S.sm} onClick={props.onCancel}><i className="ti ti-arrow-left" /> 취소</button>
        <span style={{ fontSize: 14, fontWeight: 500, color: '#fff' }}>운동 인증</span>
        <div style={{ width: 50 }} />
      </div>

      {st === 'upload' && (
        <div
          onClick={() => fileRef.current.click()}
          style={{ textAlign: 'center', padding: '2.5rem 1rem', cursor: 'pointer', border: '1.5px dashed #2a2a2a', borderRadius: 14, marginBottom: 12 }}
        >
          <i className="ti ti-upload" style={{ fontSize: 36, color: '#444' }} />
          <div style={{ fontSize: 15, fontWeight: 500, margin: '10px 0 4px', color: '#bbb' }}>운동 앱 스크린샷 업로드</div>
          <div style={{ fontSize: 12, color: '#555' }}>여러 장 동시 선택 가능</div>
          <div style={{ fontSize: 11, color: '#444', marginTop: 4 }}>삼성헬스 · 애플피트니스 · 나이키런 · 스트라바 · 가민</div>
        </div>
      )}

      {st === 'analyzing' && (
        <div style={Object.assign({}, S.card, { textAlign: 'center', padding: '2rem' })}>
          <i className="ti ti-loader" style={{ fontSize: 28, color: '#666' }} />
          <div style={{ fontSize: 13, color: '#777', marginTop: 10 }}>
            {items.length}장 분석 중이에요...
          </div>
        </div>
      )}

      {st === 'result' && (
        <div>
          <div style={{ fontSize: 12, color: '#888', marginBottom: 10 }}>
            {okCount}장 인증 확인 · {items.length - okCount}장 실패
            {okCount > 0 && <span style={{ color: '#555' }}> (탭해서 제외 가능)</span>}
          </div>

          {items.map((it, idx) => (
            <div key={idx} style={{ display: 'flex', gap: 10, marginBottom: 10, opacity: it.status === 'skip' ? 0.4 : 1 }}>
              <img
                src={it.preview}
                style={{ width: 72, height: 72, borderRadius: 8, objectFit: 'cover', flexShrink: 0, cursor: it.status !== 'fail' ? 'pointer' : 'default' }}
                onClick={() => it.status !== 'fail' && toggleItem(idx)}
              />
              <div style={{
                flex: 1,
                background: it.status === 'ok' ? '#0d2a1a' : it.status === 'skip' ? '#1a1a1a' : '#2a1010',
                border: '1px solid ' + (it.status === 'ok' ? '#1a5c2a' : it.status === 'skip' ? '#333' : '#5c1a1a'),
                borderRadius: 10, padding: '8px 12px'
              }}>
                {it.status === 'ok' && (
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 500, color: '#4caf87' }}>✓ 인증 확인됨</div>
                    {it.result.exercise_date && <div style={{ fontSize: 12, color: '#4caf87' }}>{it.result.exercise_date}</div>}
                    {it.result.exercise_type && <div style={{ fontSize: 12, color: '#4caf87' }}>{it.result.exercise_type}{it.result.duration_minutes ? ' · ' + fDur(it.result.duration_minutes) : ''}</div>}
                    {it.result.duration_minutes > 0 && it.result.duration_minutes < 30 && (
                      <div style={{ fontSize: 12, color: '#e09a4c', marginTop: 4, background: '#2a1e00', borderRadius: 5, padding: '4px 8px' }}>
                        ⚠️ 운동 시간 30분 미만 — 누적 시간엔 반영되지만 인증 횟수로 카운트되지 않아요
                      </div>
                    )}
                  </div>
                )}
                {it.status === 'skip' && (
                  <div style={{ fontSize: 13, color: '#666' }}>제외됨 (탭해서 다시 포함)</div>
                )}
                {it.status === 'fail' && (
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 500, color: '#e05c5c' }}>✗ 인식 실패</div>
                    <div style={{ fontSize: 12, color: '#e05c5c' }}>{it.result.reason}</div>
                  </div>
                )}
              </div>
            </div>
          ))}

          {okCount > 0 && (
            <button style={S.bb('#1a5c2a')} onClick={confirmAll}>
              {okCount}건 인증 완료하기
            </button>
          )}
          <button style={Object.assign({}, S.bb(), { marginTop: 8 })} onClick={() => {
            setItems([]); setSt('upload'); fileRef.current.value = '';
          }}>
            다시 선택하기
          </button>
        </div>
      )}

      <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={handleFiles} />
    </div>
  );
}


function IconPicker(props) {

  const existing = (cfg.iconConfig && cfg.iconConfig[me]) || null;
  const defaultIcon = MEMBER_ICONS[0];
  const [shape, setShape] = useState((existing && existing.shape) || defaultIcon.shape);
  const [color, setColor] = useState((existing && existing.color) || defaultIcon.color);
  const [busy, setBusy] = useState(false);

  const save = async () => {
    setBusy(true);
    const newIconCfg = Object.assign({}, cfg.iconConfig || {});
    newIconCfg[me] = { shape, color };
    await onSave(newIconCfg);
    setBusy(false);
  };

  return (
    <div>
      <div style={{ fontSize: 13, color: '#666', marginBottom: 12 }}>

    </div>
  );
}

function ResetModal(props) {

        <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>

function AdminScreen(props) {
  const { cfg, records, me, onBack, onCfgSaved, onNameChange } = props;

  const [newCode, setNewCode] = useState('');
  const [req, setReq] = useState(String(cfg.required));
  const [fine, setFine] = useState(String(cfg.finePerMiss));
  const [max, setMax] = useState(String(cfg.maxFine));
  const [newName, setNewName] = useState('');
  const [nameErr, setNameErr] = useState('');
  const [codeErr, setCodeErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [showReset, setShowReset] = useState(false);
  const [localCfg, setLocalCfg] = useState(cfg);

  const weeks = [...new Set(records.map(r => r.week))].sort().reverse();
  const names = [...new Set(records.map(r => r.name))];
  const cT = {}, cF = {};
  names.forEach(n => { cT[n] = 0; cF[n] = 0; });

  const changeName = () => {
    const n = newName.trim();
    if (!n) { setNameErr('이름을 입력하세요'); return; }
    if (n === me) { setNameErr('현재 이름과 같아요'); return; }
    onNameChange(n);
    setNewName('');
    setNameErr('');
    alert('이름이 "' + n + '"으로 변경됐어요!');
  };

  const changeCode = async () => {
    const code = newCode.trim().toUpperCase();
    if (!code) { setCodeErr('새 코드를 입력하세요'); return; }
    setBusy(true);
    try {
      const nc = Object.assign({}, localCfg, { inviteCode: code });
      await sheetsCall('saveConfig', nc);
      setLocalCfg(nc);
      onCfgSaved(nc);
      alert('초대 코드가 "' + code + '"로 변경됐어요!\n기존 멤버들에게 새 코드를 알려주세요.');
      setNewCode('');
      setCodeErr('');
    } catch(e) {
      setCodeErr('오류: ' + e.message);
    } finally {
      setBusy(false);
    }
  };

  const saveRules = async () => {
    setBusy(true);
    try {
      const nc = Object.assign({}, localCfg, { required: parseInt(req) || 2, finePerMiss: parseInt(fine) || 5000, maxFine: parseInt(max) || 10000 });
      await sheetsCall('saveConfig', nc);
      setLocalCfg(nc);
      onCfgSaved(nc);
      alert('저장됐어요!');
    } catch(e) {
      alert('오류: ' + e.message);
    } finally {
      setBusy(false);
    }

    <div style={S.wrap}>
      {showReset && (

          cfg={localCfg}

        ) : (
          <div>
            <div style={{ display: 'flex', justifyContent: 'flex-end', fontSize: 11, color: '#444', paddingBottom: 6 }}>
              <span style={{ minWidth: 70, textAlign: 'center' }}>운동시간</span>
              <span style={{ minWidth: 60, textAlign: 'right' }}>벌금</span>
            </div>
            {weeks.map(wk => {
              const b = wBounds(wk);
              return (
                <div key={wk} style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 11, color: '#444', marginBottom: 4, paddingBottom: 4, borderBottom: '1px solid #1e1e1e' }}>{fd(b.mon)} ~ {fd(b.sun)}</div>
                  {names.map(n => {
                    const rs = records.filter(r => r.name === n && r.week === wk);
                    const c = new Set(rs.filter(r => (r.duration || 0) >= 30).map(r => r.date)).size;
                    const dur = rs.reduce((s, r) => s + (r.duration || 0), 0);
                    const f = Math.min(Math.max(0, cfg.required - c) * cfg.finePerMiss, cfg.maxFine);
                    cT[n] += dur; cF[n] += f;
                    const ok = c >= cfg.required;
                    return (
                      <div key={n} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderBottom: '1px solid #1a1a1a', fontSize: 13 }}>
                        <span style={{ color: '#bbb' }}>{n}</span>
                        <span style={{ color: '#666', minWidth: 70, textAlign: 'center' }}>{fDur(dur)}</span>
                        <span style={{ fontWeight: 500, minWidth: 60, textAlign: 'right', color: ok ? '#4caf87' : f > 0 ? '#e05c5c' : '#666' }}>
                          {ok ? '완료' : f > 0 ? '-' + won(f) : c + '/' + cfg.required}
                        </span>
                      </div>
                    );
                  })}
                </div>
              );
            })}
            <div style={{ borderTop: '1px solid #222', paddingTop: 10, marginTop: 4 }}>
              <div style={{ fontSize: 11, color: '#444', marginBottom: 6 }}>누적 합계</div>
              {names.map(n => (
                <div key={n} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderBottom: '1px solid #1a1a1a', fontSize: 13 }}>
                  <span style={{ fontWeight: 500, color: '#bbb' }}>{n}</span>
                  <span style={{ color: '#666', minWidth: 70, textAlign: 'center' }}>{fDur(cT[n])}</span>
                  <span style={{ fontWeight: 500, minWidth: 60, textAlign: 'right', color: cF[n] > 0 ? '#e05c5c' : '#4caf87' }}>
                    {cF[n] > 0 ? '-' + won(cF[n]) : '0원'}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('loading');
  const [cfg, setCfg] = useState(null);
  const [records, setRecords] = useState([]);
  const [me, setMe] = useState('');
  const [refreshing, setRefreshing] = useState(false);

  const load = () => {
    const auth = LS.get(AK);
    if (auth && auth.verified) setMe(auth.name);
    sheetsCall('getAll')
      .then(data => {
        setRecords(data.records || []);
        if (!data.config) {
          setScreen('setup');
        } else {
          setCfg(data.config);
          setScreen((auth && auth.verified) ? 'main' : 'code');
        }
      })
      .catch(e => {
        console.error(e);
        setScreen('error');
      });
  };

  useEffect(() => { load(); }, []);

  const refresh = async () => {
    setRefreshing(true);
    try {
      const data = await sheetsCall('getAll');
      if (data.config) setCfg(data.config);
      setRecords(data.records || []);
    } catch(e) {
      alert('새로고침 실패: ' + e.message);
    } finally {
      setRefreshing(false);
    }
  };

  const login = name => { setMe(name); LS.set(AK, { name: name, verified: true }); };
  const logout = () => { setMe(''); LS.set(AK, { name: '', verified: false }); setScreen('code'); };

  if (screen === 'loading') {
    return <div style={S.wrap}><Logo icon="🏃" title="뚱망 방지 위원회" /><Spinner msg="Google Sheets에서 불러오는 중..." /></div>;
  }

  if (screen === 'error') {
    return (
      <div style={S.wrap}>
        <Logo icon="⚠️" title="연결 오류" sub="Google Sheets 연결에 실패했어요" />
        <div style={Object.assign({}, S.card, { textAlign: 'center', padding: '1.5rem' })}>
          <div style={{ fontSize: 13, color: '#888', marginBottom: 16 }}>
            Netlify 환경변수(GOOGLE_SERVICE_ACCOUNT, SPREADSHEET_ID)를 확인하세요
          </div>
          <button style={S.bb()} onClick={() => { setScreen('loading'); load(); }}>
            다시 시도
          </button>
        </div>
      </div>
    );
  }

  if (screen === 'setup') {
    return <SetupScreen onDone={(c, n) => { setCfg(c); login(n); setScreen('main'); }} />;
  }

  if (screen === 'code') {
    return <CodeScreen cfg={cfg} onOk={() => setScreen('name')} />;
  }

  if (screen === 'name') {
    return <NameScreen onDone={n => { login(n); setScreen('main'); }} />;
  }

  if (screen === 'cert') {
    return (
      <CertScreen
        onCancel={() => setScreen('main')}
        onConfirmOne={async (certDate, certWeek, dur, exType) => {
          await sheetsCall('addCert', { name: me, week: certWeek, date: certDate, exerciseType: exType, duration: dur });
        }}
        onDone={async () => {
          await refresh();
          setScreen('main');
        }}
      />
    );
  }

  if (screen === 'admin') {
    return (
      <AdminScreen
        cfg={cfg}
        records={records}
        me={me}
        onBack={() => setScreen('main')}
        onCfgSaved={c => setCfg(c)}
        onNameChange={n => login(n)}
      />
    );
  }

  return (
    <MainScreen
      cfg={cfg}
      records={records}
      me={me}
      onCert={() => setScreen('cert')}
      onLogout={logout}
      onAdmin={() => setScreen('admin')}
      onRefresh={refresh}
      refreshing={refreshing}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
